<section class="explorer" aria-label="Map and selected location details">
<div id="combined-map" class="panel map">{{ map_html|safe }}</div>
<aside class="selection-panel" aria-label="Selected location">
<div class="selection-kicker">LOCATION INSIGHTS</div>
<h2>Selected area</h2>
<div id="selection-details" aria-live="polite" aria-atomic="true">
<div class="empty-detail"><b>Select a point on the map</b><p>Click a station or any location to explore its connectivity and the nearest loaded air-quality monitor.</p><p>The details appear here so the map stays visible.</p></div>
</div>
</aside>
</section>
